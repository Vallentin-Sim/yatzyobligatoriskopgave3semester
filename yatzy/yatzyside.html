<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="yatzygamemanager.js" defer></script>
    <link rel="stylesheet" href="yatzystyle.css">
    <title>Document</title>
</head>
<body>
    <div id = "borderBox">
        <div id = "dicePartBox">
            <div id = "diceBox">
                <p id = "die1">Die temp</p>
                <p id = "die2">Die temp</p>
                <p id = "die3">Die temp</p>
                <p id = "die4">Die temp</p>
                <p id = "die5">Die temp</p> 
            </div>
            <div id = "ThrowBox">
                <p >ThrowCount</p>
                <textarea id = "ThrowCount">0</textarea>
                <button id="throwDice" onclick="throwThemDice()">ThrowDices</button>
            </div>
        </div>
        <div id = "tablePartBox">
            <div id = "tableNumbersBox">
                <div class = "numberItem">
                    <p>1'er</p>
                    <textarea name="1'er" id="ones"></textarea>
                </div>
                <div class = "numberItem">
                    <p>2'er</p>
                    <textarea name="2'er" id="twos"></textarea>
                </div>
                <div class = "numberItem">
                    <p>3'er</p>
                    <textarea name="3'er" id="threes"></textarea>
                </div>
                <div class = "numberItem">
                    <p>4'er</p>
                    <textarea name="4'er" id="fours"></textarea>
                </div>
                <div class = "numberItem">
                    <p>5'er</p>
                    <textarea name="5'er" id="fives"></textarea>
                </div>
                <div class = "numberItem">
                    <p>6'er</p>
                    <textarea name="6'er" id="sixes"></textarea>
                </div>
            </div>
            <div id = "tableMiscBox">
                <div class = "scoringItem">
                    <p>1 pair</p>
                    <textarea name="1 pair" id="pair"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>2 pair</p>
                    <textarea name="2 pair" id="twoPair"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>3 of a kind</p>
                    <textarea name="3 of a kind" id="treeOfAkind"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>4 of a kind</p>
                    <textarea name="4 of a kind" id="fourOfAKind"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>Fullhouse</p>
                    <textarea name="fullhouse" id="fullhouse"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>Small Straight</p>
                    <textarea name="small Straight" id="smallStraight"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>Big Straight</p>
                    <textarea name="big Straight" id="bigStraight"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>Chance</p>
                    <textarea name="Chance" id="Chance"></textarea>
                </div>
                <div class = "scoringItem">
                    <p>Yatzy</p>
                    <textarea name="Yatzy" id="Yatzy"></textarea>
                </div>
            </div>
        </div>
        <div id = "BonusBox">
            <div class = "scoringBoxItem">
                <p>Bonus</p>
                <textarea name="Bonus" id="Bonus"></textarea>
            </div>
             <div class = "scoringBoxItem">
                <p>Sum</p>
                <textarea name="Sum" id="Sum"></textarea>
             </div>
        </div>
        <div id = "scoringBox">
            <p>Score</p>
            <textarea name="Score" id="Score"></textarea>
            <button id="Restart" onclick="restart()">Restart</button>
        </div>
    </div>   
</body>
</html>
